<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant Gallery</title>
<style>
  :root{
    --bg:#0c0e13;
    --panel:#14161d;
    --panel2:#1b1e27;
    --border:#2a2e3a;
    --gold:#f0b727;
    --gold-dim:#8a6a1c;
    --text:#eef0f5;
    --text-dim:#9096a6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .topbar h1{font-size:16px;font-weight:600;letter-spacing:.3px;}
  .topbar .sub{color:var(--text-dim);font-size:12px;margin-left:auto;}

  /* ---------- GRID VIEW ---------- */
  .category-label{
    display:flex;align-items:center;gap:8px;
    padding:18px 16px 10px;
    color:var(--gold);
    font-size:12px;font-weight:700;letter-spacing:1.5px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 16px 32px;
  }
  .card{
    position:relative;
    aspect-ratio:1/1.05;
    border-radius:14px;
    border:2px solid var(--border);
    overflow:hidden;
    cursor:pointer;
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:active{transform:scale(.97);}
  .card.rare{border-color:var(--gold);}
  .card.epic{border-color:#8a5cf6;}
  .card-art{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:800;color:rgba(255,255,255,.9);
  }
  .card-art img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .card-name{
    position:absolute;left:0;right:0;bottom:0;
    padding:20px 10px 10px;
    font-size:14px;font-weight:600;
    background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
  }
  .badges{
    position:absolute;top:8px;right:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .badge{
    width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    backdrop-filter:blur(2px);
  }

  /* ---------- DETAIL VIEW ---------- */
  .detail{
    display:none;
    padding:16px;
    max-width:520px;
    margin:0 auto;
    opacity:0;
    transform:scale(.9) translateY(14px);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .detail.active{display:block;}
  .detail.show{opacity:1;transform:scale(1) translateY(0);}
  .detail-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:4px;
  }
  .detail-eyebrow{
    color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:6px;
  }
  .detail-title{font-size:30px;font-weight:800;}
  .close-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--border);
    color:var(--text);font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .hr{height:1px;background:var(--border);margin:18px 0;}

  .variants-eyebrow{
    display:flex;align-items:center;gap:8px;
    color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px;
  }
  .variant-name{font-size:22px;font-weight:700;margin-bottom:6px;}
  .variant-meta{color:var(--text-dim);font-size:13px;margin-bottom:16px;}

  .action-row{display:flex;gap:10px;margin-bottom:22px;}
  .btn{
    border:none;border-radius:10px;
    padding:13px 18px;
    font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:#1a1300;flex:1;justify-content:center;}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}

  .preview{
    position:relative;
    border:3px solid var(--gold);
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:3/4;
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    display:flex;align-items:center;justify-content:center;
  }
  .preview .card-art{font-size:80px;width:100%;height:100%;}
  .check{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:50%;
    background:var(--bg);border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-size:16px;font-weight:900;
  }

  .variant-switch{
    display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;
  }
  .chip{
    padding:8px 12px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--border);
    font-size:12px;color:var(--text-dim);cursor:pointer;
  }
  .chip.active{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700;}

  /* files modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:50;align-items:flex-end;justify-content:center;
    opacity:0;
    transition:opacity .2s ease;
  }
  .overlay.active{display:flex;}
  .overlay.show{opacity:1;}
  .sheet{
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:18px 16px 28px;
    transform:translateY(40px) scale(.96);
    opacity:0;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .overlay.show .sheet{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  .sheet h3{font-size:15px;margin-bottom:12px;}
  .file-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .file-item:last-child{border-bottom:none;}
  .file-item .fname{color:var(--text);}
  .file-item .fsize{color:var(--text-dim);}
</style>
</head>
<body>

  <div class="topbar">
    <div class="dot"></div>
    <h1>Variant Gallery</h1>
    <div class="sub" id="countLabel"></div>
  </div>

  <!-- GRID VIEW -->
  <div id="gridView">
    <div class="category-label">◆ CHARACTERS</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="detail" id="detailView">
    <div class="detail-header">
      <div>
        <div class="detail-eyebrow" id="detEyebrow">CATEGORY</div>
        <div class="detail-title" id="detTitle">Name</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>

    <div class="hr"></div>

    <div class="action-row">
      <button class="btn btn-primary" id="downloadBtn">⬇ Download</button>
      <button class="btn btn-secondary" onclick="openFiles()">▤ Files</button>
    </div>

    <div class="preview">
      <div class="card-art" id="detArt"></div>
      <div class="check">✓</div>
    </div>

    <div class="variant-switch" id="variantSwitch"></div>
  </div>

  <!-- FILES SHEET -->
  <div class="overlay" id="filesOverlay" onclick="if(event.target===this)closeFiles()">
    <div class="sheet">
      <h3>Files in this variant</h3>
      <div id="fileList"></div>
      <button class="btn btn-secondary" style="width:100%;margin-top:14px;justify-content:center;" onclick="closeFiles()">Close</button>
    </div>
  </div>

<script>
/* ---- Sample data — swap emoji/colors for real thumbnails & edit names/files freely ---- */
/* ============================================
   ISI LINK DI SINI. Ganti teks yang ada di dalam
   tanda kutip " " punya tiap baris thumb: dan drive:
   ============================================ */
const DATA = [
  { id:1, name:"AMV TYPOGRAPHY", eyebrow:"FREE", rarity:"rare",
    thumb:"https://i.pinimg.com/736x/0d/0d/3c/0d0d3cde5fd01b5de4c902ab5aca8940.jpg", color:"#3a4a6b",
    variants:[
      {name:"𝖠𝗍𝗁𝖺𝗇𝖺𝗌𝗂𝖺 𝖽𝖾 𝖠𝗅𝗀𝖾𝗋 𝖮𝖻𝖾𝗅𝗂𝖺", total:2, selected:1,
        thumb:"https://i.pinimg.com/736x/0d/0d/3c/0d0d3cde5fd01b5de4c902ab5aca8940.jpg",
        drive:"https://drive.google.com/drive/folders/1vK2wBa858EUvVSYg9yU-NK9K3jM-llBF?usp=sharing",
        files:[{n:"part 1.aep",s:"84 MB"},{n:"preview.png",s:"3.1 MB"}]}
    ]},
  { id:2, name:"ytta", eyebrow:"CHARACTER", rarity:"epic",
    thumb:"PASTE_LINK_THUMBNAIL_PRUNE", color:"#4a2f6b",
    variants:[
      {name:"Mid", total:3, selected:1,
        thumb:"PASTE_LINK_PREVIEW_PRUNE_REQUIEM",
        drive:"PASTE_LINK_DRIVE_PRUNE_REQUIEM",
        files:[{n:"b",s:"91 MB"},{n:"h",s:"22 MB"}]}
    ]},
  { id:3, name:"s", eyebrow:"CHARACTER", rarity:"rare",
    thumb:"PASTE_LINK_THUMBNAIL_NICOLE", color:"#6b3a2f",
    variants:[
      {name:"Golr", total:2, selected:2,
        thumb:"PASTE_LINK_PREVIEW_NICOLE_GOLDENHOUR",
        drive:"PASTE_LINK_DRIVE_NICOLE_GOLDENHOUR",
        files:[{n:"b",s:"79 MB"},{n:"f",s:"14 MB"}]}
    ]},
  { id:4, name:"u", eyebrow:"CHARACTER", rarity:"rare",
    thumb:"PASTE_LINK_THUMBNAIL_LINNEA", color:"#2f6b52",
    variants:[
      {name:"jj", total:1, selected:1,
        thumb:"PASTE_LINK_PREVIEW_LINNEA_SPRINGWING",
        drive:"PASTE_LINK_DRIVE_LINNEA_SPRINGWING",
        files:[{n:"j.psd",s:"68 MB"}]}
    ]}
];

let current = null;
let currentVariantIdx = 0;

function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.forEach(ch=>{
    const card = document.createElement('div');
    card.className = 'card ' + ch.rarity;
    card.style.background = `linear-gradient(160deg, ${ch.color}, #14161d)`;
    card.onclick = ()=>openDetail(ch.id);
    card.innerHTML = `
      <div class="card-art"><img src="${ch.thumb}" alt="${ch.name}" loading="lazy"></div>
      <div class="card-name">${ch.name}</div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('countLabel').textContent = DATA.length + ' items';
}

function openDetail(id){
  current = DATA.find(c=>c.id===id);
  currentVariantIdx = 0;
  document.getElementById('gridView').style.display = 'none';
  const d = document.getElementById('detailView');
  d.classList.add('active');
  d.classList.remove('show');
  renderDetail();
  requestAnimationFrame(()=> requestAnimationFrame(()=> d.classList.add('show')));
}

function closeDetail(){
  const d = document.getElementById('detailView');
  d.classList.remove('show');
  setTimeout(()=>{
    d.classList.remove('active');
    document.getElementById('gridView').style.display = 'block';
  }, 220);
}

function renderDetail(){
  const ch = current;
  const v = ch.variants[currentVariantIdx];
  document.getElementById('detEyebrow').textContent = ch.eyebrow;
  document.getElementById('detTitle').textContent = ch.name;
  document.getElementById('detArt').innerHTML =
    `<img src="${v.thumb || ch.thumb}" alt="${v.name}" style="width:100%;height:100%;object-fit:cover;">`;
  document.querySelector('.preview').style.background =
    `linear-gradient(160deg, ${ch.color}, #14161d)`;

  const sw = document.getElementById('variantSwitch');
  sw.innerHTML = '';
  if(ch.variants.length > 1){
    ch.variants.forEach((vv,i)=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (i===currentVariantIdx?' active':'');
      chip.textContent = vv.name;
      chip.onclick = ()=>{ currentVariantIdx = i; renderDetail(); };
      sw.appendChild(chip);
    });
  }

  document.getElementById('downloadBtn').onclick = ()=>downloadVariant(ch, v);
}

function downloadVariant(ch, v){
  if(!v.drive){ alert('Link Google Drive belum diisi untuk variant ini.'); return; }
  window.open(v.drive, '_blank');
}

function openFiles(){
  const v = current.variants[currentVariantIdx];
  const list = document.getElementById('fileList');
  list.innerHTML = v.files.map(f=>`
    <div class="file-item">
      <span class="fname">${f.n}</span>
      <span class="fsize">${f.s}</span>
    </div>
  `).join('');
  const ov = document.getElementById('filesOverlay');
  ov.classList.add('active');
  ov.classList.remove('show');
  requestAnimationFrame(()=> requestAnimationFrame(()=> ov.classList.add('show')));
}
function closeFiles(){
  const ov = document.getElementById('filesOverlay');
  ov.classList.remove('show');
  setTimeout(()=> ov.classList.remove('active'), 220);
}

renderGrid();
</script>
</body>
</html>

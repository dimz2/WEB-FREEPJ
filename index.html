<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variant Gallery</title>
<style>
  :root{
    --bg:#0c0e13;
    --panel:#14161d;
    --panel2:#1b1e27;
    --border:#2a2e3a;
    --gold:#f0b727;
    --gold-dim:#8a6a1c;
    --text:#eef0f5;
    --text-dim:#9096a6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;
  }
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 16px;background:var(--panel);
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .topbar .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .topbar h1{font-size:16px;font-weight:600;letter-spacing:.3px;}
  .topbar .sub{color:var(--text-dim);font-size:12px;margin-left:auto;}
  .icon-btn{
    width:34px;height:34px;border-radius:9px;
    background:var(--panel2);border:1px solid var(--border);
    color:var(--text);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .admin-bar{
    display:flex;gap:8px;padding:10px 16px;
    background:#1c1608;border-bottom:1px solid var(--gold-dim);
    position:sticky;top:57px;z-index:19;
    overflow-x:auto;
  }
  .admin-bar .btn{padding:9px 14px;font-size:12px;white-space:nowrap;flex:none;}

  /* ---------- GRID VIEW ---------- */
  .category-label{
    display:flex;align-items:center;gap:8px;
    padding:18px 16px 10px;
    color:var(--gold);
    font-size:12px;font-weight:700;letter-spacing:1.5px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 16px 32px;
  }
  .card{
    position:relative;
    aspect-ratio:1/1.05;
    border-radius:14px;
    border:2px solid var(--border);
    overflow:hidden;
    cursor:pointer;
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    transition:transform .15s ease, border-color .15s ease;
  }
  .card:active{transform:scale(.97);}
  .card.rare{border-color:var(--gold);}
  .card.epic{border-color:#8a5cf6;}
  .card-art{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:44px;font-weight:800;color:rgba(255,255,255,.9);
  }
  .card-art img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .card-name{
    position:absolute;left:0;right:0;bottom:0;
    padding:20px 10px 10px;
    font-size:14px;font-weight:600;
    background:linear-gradient(to top, rgba(0,0,0,.85), transparent);
  }
  .badges{
    position:absolute;top:8px;right:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .badge{
    width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    backdrop-filter:blur(2px);
  }
  .admin-actions{
    position:absolute;top:8px;left:8px;z-index:5;
    display:flex;gap:6px;
  }
  .admin-actions button{
    width:26px;height:26px;border-radius:50%;border:none;
    background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---------- DETAIL VIEW ---------- */
  .detail{
    display:none;
    padding:16px;
    max-width:520px;
    margin:0 auto;
    opacity:0;
    transform:scale(.9) translateY(14px);
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .detail.active{display:block;}
  .detail.show{opacity:1;transform:scale(1) translateY(0);}
  .detail-header{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:4px;
  }
  .detail-eyebrow{
    color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:6px;
  }
  .detail-title{font-size:30px;font-weight:800;}
  .close-btn{
    width:38px;height:38px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--border);
    color:var(--text);font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .hr{height:1px;background:var(--border);margin:18px 0;}

  .variants-eyebrow{
    display:flex;align-items:center;gap:8px;
    color:var(--gold);font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px;
  }
  .variant-name{font-size:22px;font-weight:700;margin-bottom:6px;}
  .variant-meta{color:var(--text-dim);font-size:13px;margin-bottom:16px;}

  .action-row{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:10px;
    padding:13px 18px;
    font-size:14px;font-weight:700;
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
  }
  .btn-primary{background:var(--gold);color:#1a1300;flex:1;justify-content:center;}
  .btn-secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}

  .preview{
    position:relative;
    border:3px solid var(--gold);
    border-radius:16px;
    overflow:hidden;
    aspect-ratio:3/4;
    background:linear-gradient(160deg,var(--panel2),var(--panel));
    display:flex;align-items:center;justify-content:center;
  }
  .preview .card-art{font-size:80px;width:100%;height:100%;}
  .check{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;border-radius:50%;
    background:var(--bg);border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);font-size:16px;font-weight:900;
  }

  .variant-switch{
    display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;
  }
  .chip{
    padding:8px 12px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--border);
    font-size:12px;color:var(--text-dim);cursor:pointer;
  }
  .chip.active{background:var(--gold);color:#1a1300;border-color:var(--gold);font-weight:700;}

  /* files / gate / form modal */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
    z-index:50;align-items:flex-end;justify-content:center;
    opacity:0;
    transition:opacity .2s ease;
  }
  .overlay.active{display:flex;}
  .overlay.show{opacity:1;}
  .sheet{
    background:var(--panel);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;width:100%;max-width:520px;padding:18px 16px 28px;
    transform:translateY(40px) scale(.96);
    opacity:0;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
  }
  .overlay.show .sheet{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  .sheet h3{font-size:15px;margin-bottom:12px;}
  .file-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
  }
  .file-item:last-child{border-bottom:none;}
  .file-item .fname{color:var(--text);}
  .file-item .fsize{color:var(--text-dim);}

  /* form fields (admin panel) */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .field input, .field select{
    width:100%;padding:11px 12px;border-radius:10px;
    background:var(--bg);border:1px solid var(--border);
    color:var(--text);font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
  .field input[type="color"]{padding:4px;height:44px;cursor:pointer;}
  .variant-block{
    background:var(--panel2);border:1px solid var(--border);border-radius:12px;
    padding:12px;margin-bottom:12px;
  }
  .file-row{margin-bottom:8px;}
  #gateError{color:#ff6b6b;font-size:12px;margin-top:4px;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="dot"></div>
    <h1>Variant Gallery</h1>
    <div class="sub" id="countLabel"></div>
    <button class="icon-btn" id="gearBtn" onclick="openAdminGate()" title="Admin">⚙</button>
  </div>

  <div class="admin-bar" id="adminBar" style="display:none;">
    <button class="btn btn-primary" onclick="openCharacterForm()">+ Tambah Character</button>
    <button class="btn btn-secondary" onclick="exportDataJs()">⬇ Export data.js</button>
    <button class="btn btn-secondary" onclick="lockAdmin()">🔒 Keluar</button>
  </div>

  <!-- GRID VIEW -->
  <div id="gridView">
    <div class="category-label">◆ CHARACTERS</div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="detail" id="detailView">
    <div class="detail-header">
      <div>
        <div class="detail-eyebrow" id="detEyebrow">CATEGORY</div>
        <div class="detail-title" id="detTitle">Name</div>
      </div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>

    <div class="hr"></div>

    <div class="action-row">
      <button class="btn btn-primary" id="downloadBtn">⬇ Download</button>
      <button class="btn btn-secondary" onclick="openFiles()">▤ Files</button>
      <button class="btn btn-secondary" id="editBtn" style="display:none;">✎ Edit</button>
      <button class="btn btn-secondary" id="deleteBtn" style="display:none;">🗑 Hapus</button>
    </div>

    <div class="preview">
      <div class="card-art" id="detArt"></div>
      <div class="check">✓</div>
    </div>

    <div class="variant-switch" id="variantSwitch"></div>
  </div>

  <!-- FILES SHEET -->
  <div class="overlay" id="filesOverlay" onclick="if(event.target===this)closeFiles()">
    <div class="sheet">
      <h3>Files in this variant</h3>
      <div id="fileList"></div>
      <button class="btn btn-secondary" style="width:100%;margin-top:14px;justify-content:center;" onclick="closeFiles()">Close</button>
    </div>
  </div>

  <!-- ADMIN PASSWORD GATE -->
  <div class="overlay" id="gateOverlay" onclick="if(event.target===this)closeGate()">
    <div class="sheet">
      <h3>Masuk Admin</h3>
      <div class="field">
        <label>Password</label>
        <input id="gatePassInput" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')submitAdminPassword()">
      </div>
      <div id="gateError" style="display:none;">Password salah.</div>
      <div class="action-row" style="margin-top:16px;margin-bottom:0;">
        <button class="btn btn-primary" onclick="submitAdminPassword()">Masuk</button>
        <button class="btn btn-secondary" onclick="closeGate()">Batal</button>
      </div>
    </div>
  </div>

  <!-- CREATE / EDIT CHARACTER FORM -->
  <div class="overlay" id="charFormOverlay" onclick="if(event.target===this)closeCharForm()">
    <div class="sheet" style="max-height:88vh;overflow-y:auto;">
      <h3 id="formTitle">Tambah Character</h3>
      <div class="field"><label>Nama</label><input id="f_name"></div>
      <div class="field"><label>Eyebrow / Kategori</label><input id="f_eyebrow" value="CHARACTER"></div>
      <div style="display:flex;gap:8px;">
        <div class="field" style="flex:1;"><label>Rarity</label>
          <select id="f_rarity">
            <option value="common">common</option>
            <option value="rare">rare</option>
            <option value="epic">epic</option>
          </select>
        </div>
        <div class="field" style="flex:1;"><label>Warna gradient</label><input id="f_color" type="color" value="#3a4a6b"></div>
      </div>
      <div class="field"><label>Thumbnail URL (grid)</label><input id="f_thumb" placeholder="https://..."></div>

      <div class="hr"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;">Variants</h3>
        <button type="button" class="chip" onclick="addVariantRow()">+ Variant</button>
      </div>
      <div id="variantRows"></div>

      <div class="action-row" style="margin-top:18px;margin-bottom:0;">
        <button class="btn btn-primary" onclick="saveCharacterForm()">💾 Simpan</button>
        <button class="btn btn-secondary" onclick="closeCharForm()">Batal</button>
      </div>
    </div>
  </div>

<script src="data.js"></script>
<script src="auth.js"></script>
<script>
/* ============================================
   State
   ============================================ */
let current = null;
let currentVariantIdx = 0;
let adminUnlocked = false;
let editingId = null;
let variantCounter = 0;

/* ============================================
   Overlay helpers (reused by gate + files + form)
   ============================================ */
function showOverlay(id){
  const ov = document.getElementById(id);
  ov.classList.add('active'); ov.classList.remove('show');
  requestAnimationFrame(()=> requestAnimationFrame(()=> ov.classList.add('show')));
}
function hideOverlay(id){
  const ov = document.getElementById(id);
  ov.classList.remove('show');
  setTimeout(()=> ov.classList.remove('active'), 220);
}

/* ============================================
   Grid view
   ============================================ */
function renderGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.forEach(ch=>{
    const card = document.createElement('div');
    card.className = 'card ' + ch.rarity;
    card.style.background = `linear-gradient(160deg, ${ch.color}, #14161d)`;
    card.onclick = (e)=>{ if(e.target.closest('.admin-actions')) return; openDetail(ch.id); };
    card.innerHTML = `
      <div class="card-art"><img src="${ch.thumb}" alt="${ch.name}" loading="lazy"></div>
      <div class="card-name">${ch.name}</div>
      ${adminUnlocked ? `<div class="admin-actions">
        <button onclick="event.stopPropagation();openCharacterForm(${ch.id})" title="Edit">✎</button>
        <button onclick="event.stopPropagation();deleteCharacter(${ch.id})" title="Hapus">🗑</button>
      </div>` : ''}
    `;
    grid.appendChild(card);
  });
  document.getElementById('countLabel').textContent = DATA.length + ' items';
}

/* ============================================
   Detail view
   ============================================ */
function openDetail(id){
  current = DATA.find(c=>c.id===id);
  currentVariantIdx = 0;
  document.getElementById('gridView').style.display = 'none';
  const d = document.getElementById('detailView');
  d.classList.add('active');
  d.classList.remove('show');
  renderDetail();
  requestAnimationFrame(()=> requestAnimationFrame(()=> d.classList.add('show')));
}

function closeDetail(){
  const d = document.getElementById('detailView');
  d.classList.remove('show');
  setTimeout(()=>{
    d.classList.remove('active');
    document.getElementById('gridView').style.display = 'block';
  }, 220);
}

function renderDetail(){
  const ch = current;
  const v = ch.variants[currentVariantIdx];
  document.getElementById('detEyebrow').textContent = ch.eyebrow;
  document.getElementById('detTitle').textContent = ch.name;
  document.getElementById('detArt').innerHTML =
    `<img src="${v.thumb || ch.thumb}" alt="${v.name}" style="width:100%;height:100%;object-fit:cover;">`;
  document.querySelector('.preview').style.background =
    `linear-gradient(160deg, ${ch.color}, #14161d)`;

  const sw = document.getElementById('variantSwitch');
  sw.innerHTML = '';
  if(ch.variants.length > 1){
    ch.variants.forEach((vv,i)=>{
      const chip = document.createElement('div');
      chip.className = 'chip' + (i===currentVariantIdx?' active':'');
      chip.textContent = vv.name;
      chip.onclick = ()=>{ currentVariantIdx = i; renderDetail(); };
      sw.appendChild(chip);
    });
  }

  document.getElementById('downloadBtn').onclick = ()=>downloadVariant(ch, v);

  const editBtn = document.getElementById('editBtn');
  const delBtn = document.getElementById('deleteBtn');
  if(adminUnlocked){
    editBtn.style.display='flex'; delBtn.style.display='flex';
    editBtn.onclick = ()=>openCharacterForm(ch.id);
    delBtn.onclick = ()=>deleteCharacter(ch.id);
  } else {
    editBtn.style.display='none'; delBtn.style.display='none';
  }
}

function downloadVariant(ch, v){
  if(!v.drive){ alert('Link Google Drive belum diisi untuk variant ini.'); return; }
  window.open(v.drive, '_blank');
}

function openFiles(){
  const v = current.variants[currentVariantIdx];
  const list = document.getElementById('fileList');
  list.innerHTML = v.files.map(f=>`
    <div class="file-item">
      <span class="fname">${f.n}</span>
      <span class="fsize">${f.s}</span>
    </div>
  `).join('');
  showOverlay('filesOverlay');
}
function closeFiles(){ hideOverlay('filesOverlay'); }

/* ============================================
   Admin gate (password check via SHA-256, hash lives in auth.js)
   ============================================ */
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function openAdminGate(){
  if(adminUnlocked){ lockAdmin(); return; }
  if(typeof ADMIN_PASSWORD_HASH === 'undefined'){
    alert('auth.js belum ke-load. Pastikan file auth.js ada satu folder sama index.html.');
    return;
  }
  document.getElementById('gatePassInput').value = '';
  document.getElementById('gateError').style.display = 'none';
  showOverlay('gateOverlay');
  setTimeout(()=> document.getElementById('gatePassInput').focus(), 250);
}
function closeGate(){ hideOverlay('gateOverlay'); }

async function submitAdminPassword(){
  const pass = document.getElementById('gatePassInput').value;
  const hash = await sha256(pass);
  if(hash === ADMIN_PASSWORD_HASH){
    adminUnlocked = true;
    closeGate();
    document.getElementById('adminBar').style.display = 'flex';
    document.getElementById('gearBtn').textContent = '🔓';
    renderGrid();
    if(current) renderDetail();
  } else {
    document.getElementById('gateError').style.display = 'block';
  }
}
function lockAdmin(){
  adminUnlocked = false;
  document.getElementById('adminBar').style.display = 'none';
  document.getElementById('gearBtn').textContent = '⚙';
  renderGrid();
  if(current) renderDetail();
}

/* ============================================
   Create / edit character form
   ============================================ */
function esc(v){ return (v===undefined || v===null) ? '' : String(v).replace(/"/g,'&quot;'); }

function openCharacterForm(id){
  editingId = id || null;
  const ch = id ? DATA.find(c=>c.id===id) : null;
  document.getElementById('formTitle').textContent = ch ? 'Edit Character' : 'Tambah Character';
  document.getElementById('f_name').value = ch?.name || '';
  document.getElementById('f_eyebrow').value = ch?.eyebrow || 'CHARACTER';
  document.getElementById('f_rarity').value = ch?.rarity || 'common';
  document.getElementById('f_color').value = ch?.color || '#3a4a6b';
  document.getElementById('f_thumb').value = ch?.thumb || '';
  document.getElementById('variantRows').innerHTML = '';
  if(ch && ch.variants.length){
    ch.variants.forEach(v=>addVariantRow(v));
  } else {
    addVariantRow();
  }
  showOverlay('charFormOverlay');
}
function closeCharForm(){ hideOverlay('charFormOverlay'); }

function addVariantRow(prefill){
  variantCounter++;
  const wrap = document.createElement('div');
  wrap.className = 'variant-block';
  wrap.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <strong style="font-size:13px;">Variant</strong>
      <button type="button" class="chip" onclick="this.closest('.variant-block').remove()">✕ Hapus variant</button>
    </div>
    <div class="field"><label>Nama variant</label><input class="v-name" value="${esc(prefill?.name)}"></div>
    <div style="display:flex;gap:8px;">
      <div class="field" style="flex:1;"><label>Total</label><input class="v-total" type="number" min="1" value="${prefill?.total ?? 1}"></div>
      <div class="field" style="flex:1;"><label>Selected</label><input class="v-selected" type="number" min="1" value="${prefill?.selected ?? 1}"></div>
    </div>
    <div class="field"><label>Preview thumbnail URL</label><input class="v-thumb" value="${esc(prefill?.thumb)}"></div>
    <div class="field"><label>Link Google Drive</label><input class="v-drive" value="${esc(prefill?.drive)}"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;margin-bottom:8px;">
      <span style="font-size:12px;color:var(--text-dim);">Files</span>
      <button type="button" class="chip" onclick="addFileRow(this)">+ File</button>
    </div>
    <div class="file-rows"></div>
  `;
  document.getElementById('variantRows').appendChild(wrap);
  const fileRows = wrap.querySelector('.file-rows');
  if(prefill?.files?.length){
    prefill.files.forEach(f=> fileRows.appendChild(fileRowEl(f.n, f.s)));
  }
}

function fileRowEl(n='', s=''){
  const row = document.createElement('div');
  row.className = 'file-row';
  row.style.display = 'flex'; row.style.gap = '8px';
  row.innerHTML = `
    <input class="fr-name" placeholder="nama file" value="${esc(n)}" style="flex:2;padding:9px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:13px;">
    <input class="fr-size" placeholder="ukuran" value="${esc(s)}" style="flex:1;padding:9px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:13px;">
    <button type="button" class="chip" onclick="this.parentElement.remove()">✕</button>
  `;
  return row;
}
function addFileRow(btn){
  const fileRows = btn.closest('.variant-block').querySelector('.file-rows');
  fileRows.appendChild(fileRowEl());
}

function saveCharacterForm(){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ alert('Nama character wajib diisi.'); return; }

  const variants = [...document.querySelectorAll('#variantRows .variant-block')].map(block=>{
    const files = [...block.querySelectorAll('.file-rows .file-row')].map(fr=>({
      n: fr.querySelector('.fr-name').value.trim(),
      s: fr.querySelector('.fr-size').value.trim()
    })).filter(f=>f.n);
    return {
      name: block.querySelector('.v-name').value.trim() || 'Variant',
      total: parseInt(block.querySelector('.v-total').value) || 1,
      selected: parseInt(block.querySelector('.v-selected').value) || 1,
      thumb: block.querySelector('.v-thumb').value.trim(),
      drive: block.querySelector('.v-drive').value.trim(),
      files
    };
  });

  const charObj = {
    id: editingId || (DATA.reduce((m,c)=>Math.max(m,c.id),0) + 1),
    name,
    eyebrow: document.getElementById('f_eyebrow').value.trim() || 'CHARACTER',
    rarity: document.getElementById('f_rarity').value,
    thumb: document.getElementById('f_thumb').value.trim(),
    color: document.getElementById('f_color').value,
    variants: variants.length ? variants : [{name:'Default', total:1, selected:1, thumb:'', drive:'', files:[]}]
  };

  if(editingId){
    const i = DATA.findIndex(c=>c.id===editingId);
    DATA[i] = charObj;
  } else {
    DATA.push(charObj);
  }
  editingId = null;
  closeCharForm();
  renderGrid();
  showToast('Tersimpan di halaman ini. Klik "Export data.js" biar perubahan permanen di server.');
}

function deleteCharacter(id){
  if(!confirm('Hapus character ini? Ini cuma keliatan permanen setelah lo export & upload ulang data.js.')) return;
  const i = DATA.findIndex(c=>c.id===id);
  if(i>-1) DATA.splice(i,1);
  if(current && current.id===id){ closeDetail(); }
  renderGrid();
}

/* ============================================
   Export data.js (bikin file baru buat replace di server)
   ============================================ */
function exportDataJs(){
  const src = '// data.js\nconst DATA = ' + JSON.stringify(DATA, null, 2) + ';\n';
  const blob = new Blob([src], {type:'text/javascript'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'data.js';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('data.js ke-download. Upload buat replace file lama di hosting lo.');
}

/* ============================================
   Toast
   ============================================ */
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-width:520px;margin:0 auto;background:var(--panel2);border:1px solid var(--gold);color:var(--text);padding:12px 14px;border-radius:10px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:opacity .3s ease;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity = '0'; }, 3500);
}

renderGrid();
</script>
</body>
</html>
